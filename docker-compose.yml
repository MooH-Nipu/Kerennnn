services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
      - .env.local
    environment:
      - NODE_ENV=production
      - KERENNNN_DEPLOY_ENV=prod
      - VT_KEY_STATE_FILE=/app/data/vt-key-state.json
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    volumes:
      - kerennnn-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    restart: unless-stopped

volumes:
  kerennnn-data:
